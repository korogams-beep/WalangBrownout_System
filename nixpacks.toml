# nixpacks.toml
# ISSUE-004: Override the start command so Nixpacks never falls back to
#            `npx serve`, which hangs waiting for interactive TTY input.
# ISSUE-005: Disable Nixpacks build-cache so environment variables set in
#            the Railway dashboard are always picked up during the build phase
#            instead of being baked in from a stale cached layer.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm --prefix frontend install --include=dev"]

[phases.build]
cmds = ["npm --prefix frontend run build"]

[start]
cmd = "npx serve -s frontend/dist -l $PORT --no-clipboard"
